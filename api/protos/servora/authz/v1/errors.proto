syntax = "proto3";

package servora.authz.v1;

import "servora/errors/v1/errors.proto";

option go_package = "github.com/Servora-Kit/servora/api/gen/go/servora/authz/v1;authzpb";

// AuthzErrorReason defines stable client-visible authorization failures.
enum AuthzErrorReason {
  option (servora.errors.v1.default_code) = 500;

  AUTHZ_ERROR_REASON_UNSPECIFIED = 0;
  // The authenticated subject is not permitted to perform the action.
  AUTHZ_ERROR_REASON_DENIED = 1 [(servora.errors.v1.code) = 403];
  // The request cannot produce a valid authorization target.
  AUTHZ_ERROR_REASON_INVALID_REQUEST = 2 [(servora.errors.v1.code) = 400];
  // An authorization dependency is temporarily unavailable.
  AUTHZ_ERROR_REASON_UNAVAILABLE = 3 [(servora.errors.v1.code) = 503];
  // The authorization contract or framework invariant was violated.
  AUTHZ_ERROR_REASON_INTERNAL = 4 [(servora.errors.v1.code) = 500];
}
