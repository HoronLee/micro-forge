syntax = "proto3";

package servora.authz.audit.v1;

option go_package = "github.com/Servora-Kit/servora/api/gen/go/servora/authz/audit/v1;authzauditpb";

// AuthzDecision is the typed payload shared by authorization decision events.
message AuthzDecision {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ALLOWED = 1;
    DECISION_DENIED = 2;
    DECISION_ERROR = 3;
  }

  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_ALLOWED = 1;
    REASON_DENIED = 2;
    REASON_INVALID_REQUEST = 3;
    REASON_UNAVAILABLE = 4;
    REASON_INTERNAL = 5;
  }

  Decision decision = 1;
  string subject = 2;
  string action = 3;
  string resource_type = 4;
  string resource_id = 5;
  Reason reason = 6;
  int32 code = 7;
}
