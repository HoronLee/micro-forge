syntax = "proto3";

package servora.authn.v1;

import "servora/errors/v1/errors.proto";

option go_package = "github.com/Servora-Kit/servora/api/gen/go/servora/authn/v1;authnpb";

// AuthnErrorReason defines stable client-visible authentication failures.
enum AuthnErrorReason {
  option (servora.errors.v1.default_code) = 500;

  AUTHN_ERROR_REASON_UNSPECIFIED = 0;
  // Authentication credentials are absent or rejected.
  AUTHN_ERROR_REASON_UNAUTHENTICATED = 1 [(servora.errors.v1.code) = 401];
  // An authentication dependency is temporarily unavailable.
  AUTHN_ERROR_REASON_UNAVAILABLE = 2 [(servora.errors.v1.code) = 503];
  // The authentication contract or framework invariant was violated.
  AUTHN_ERROR_REASON_INTERNAL = 3 [(servora.errors.v1.code) = 500];
}
