syntax = "proto3";

package redacttest.v1;

import "servora/redact/v3/redact.proto";

option go_package = "github.com/Servora-Kit/servora/cmd/protoc-gen-redact/testdata;testdata";

message LoginRequest {
  string email = 1;
  string password = 2 [(servora.redact.v3.value).string = ""];
  bytes cap_token = 3 [(servora.redact.v3.value).bytes = ""];
}
