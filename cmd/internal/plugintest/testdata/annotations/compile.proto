syntax = "proto3";

package test.annotations.v1;

import "servora/audit/v1/annotations.proto";

message Request {
  string id = 1;
}

message Response {}

service ContractService {
  option (servora.audit.v1.service_default) = {mode: AUDIT_MODE_ENABLED};

  rpc Public(Request) returns (Response) {
    option (servora.audit.v1.rule) = {mode: AUDIT_MODE_DISABLED};
  }
}
